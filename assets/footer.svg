<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 78" width="880" height="78" role="img" aria-label="close the door"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes blink{0%,47%{opacity:1}50%,97%{opacity:.1}}
@keyframes drift{0%,100%{opacity:.25}50%{opacity:.6}}
.bk{animation:blink 1.2s infinite steps(1,end)}
.dr{animation:drift 5s ease-in-out infinite}</style><defs>
<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".55"/>
</pattern>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
</defs>
<defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#c14a2a" stop-opacity=".55"/>
<stop offset="55%" stop-color="#c14a2a" stop-opacity=".12"/>
<stop offset="100%" stop-color="#4fb3a8" stop-opacity=".30"/></linearGradient></defs>
<rect width="880" height="78" fill="#07070a"/>
<rect x="24" y="16" width="832" height="1" fill="url(#fg)"/>
<text x="24" y="44" font-size="12" letter-spacing="2.6" fill="#d9d2c5" opacity=".78">shut the door. the wired is already inside.</text>
<text x="24" y="63" font-size="10" letter-spacing="1.8" fill="#6f6a62" class="dr">.enilffo yats .no seye ruoy peek</text>
<text x="840" y="44" text-anchor="end" font-size="10.5" letter-spacing="2" fill="#4fb3a8" opacity=".75">connection // local only</text>
<circle cx="854" cy="40" r="3" fill="#4fb3a8" class="bk"/>
<text x="856" y="63" text-anchor="end" font-size="9.5" letter-spacing="1.6" fill="#6f6a62">[ no telemetry ] [ no account ] [ no server ]</text>
<rect width="880" height="78" fill="url(#sl)" opacity=".5"/>
<rect width="880" height="78" filter="url(#grain)" opacity=".06"/>
</svg>