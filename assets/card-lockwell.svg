<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 146" width="420" height="146" role="img" aria-label="Lockwell"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes scan{0%{transform:translateY(-10px);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translateY(150px);opacity:0}}
@keyframes blink{0%,47%{opacity:1}50%,97%{opacity:.12}}
.sc{animation:scan 5.5s linear infinite}
.bk{animation:blink 1.8s infinite steps(1,end)}
</style><defs>
<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".55"/>
</pattern>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
</defs>
<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#c14a2a" stop-opacity=".16"/>
  <stop offset="60%" stop-color="#c14a2a" stop-opacity="0"/>
</linearGradient>
<linearGradient id="scg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c14a2a" stop-opacity="0"/>
  <stop offset="50%" stop-color="#c14a2a" stop-opacity=".85"/>
  <stop offset="100%" stop-color="#c14a2a" stop-opacity="0"/>
</linearGradient></defs>
<rect width="420" height="146" fill="#0b0a0f"/>
<rect width="420" height="146" fill="url(#gl)"/>
<rect x="0" y="0" width="3" height="146" fill="#c14a2a" opacity=".9"/>
<rect x=".5" y=".5" width="419" height="145" fill="none" stroke="#c14a2a" stroke-width="1" opacity=".30"/>
<text x="22" y="42" font-size="21" font-weight="700" letter-spacing="1.2" fill="#d9d2c5">lockwell</text>
<text x="402" y="30" text-anchor="end" font-size="9.5" letter-spacing="2.2" fill="#6f6a62">layer:01</text>
<rect x="22" y="55" width="350" height="1" fill="#c14a2a" opacity=".22"/>
<text x="22" y="80" font-size="11.5" fill="#6f6a62">local-only encrypted vault for windows.</text>
<text x="22" y="97" font-size="11.5" fill="#6f6a62">argon2id + aes-256-gcm. no account, no server.</text>
<circle cx="26" cy="123" r="3.4" fill="#c14a2a"/>
<text x="38" y="127" font-size="10.5" letter-spacing="1.4" fill="#d9d2c5" opacity=".72">c#</text>
<text x="66" y="127" font-size="10.5" letter-spacing="1.4" fill="#6f6a62">// 1.3 mb</text>
<rect x="340" y="113" width="62" height="19" fill="#c14a2a" opacity=".13"/>
<text x="394" y="126.5" text-anchor="end" font-size="9.5" letter-spacing="1.8" fill="#c14a2a">OFFLINE</text>
<circle cx="402" cy="132" r="2.6" fill="#c14a2a" class="bk" opacity=".8"/>
<rect class="sc" x="3" y="0" width="417" height="1.2" fill="url(#scg)" opacity=".26"/>
<rect width="420" height="146" fill="url(#sl)" opacity=".55"/>
<rect width="420" height="146" filter="url(#grain)" opacity=".06"/>
</svg>