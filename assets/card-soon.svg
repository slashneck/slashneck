<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 146" width="420" height="146" role="img" aria-label="untitled"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes scan{0%{transform:translateY(-10px);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translateY(150px);opacity:0}}
@keyframes blink{0%,47%{opacity:1}50%,97%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.75}}
@keyframes crawl{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-18px}}
.sc{animation:scan 5.5s linear infinite}
.bk{animation:blink 1.8s infinite steps(1,end)}
.pl{animation:pulse 3.4s ease-in-out infinite}
.cr{animation:blink 1.1s infinite steps(1,end)}
.dash{animation:crawl 3s linear infinite}
</style><defs>
<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".55"/>
</pattern>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
</defs><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#57525e" stop-opacity=".05"/><stop offset="60%" stop-color="#57525e" stop-opacity="0"/></linearGradient><linearGradient id="scg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#57525e" stop-opacity="0"/><stop offset="50%" stop-color="#57525e" stop-opacity=".85"/><stop offset="100%" stop-color="#57525e" stop-opacity="0"/></linearGradient></defs><rect width="420" height="146" fill="#0b0a0f"/><rect width="420" height="146" fill="url(#gl)"/><rect x="0" y="0" width="3" height="146" fill="#57525e" opacity=".45" class="pl"/><rect x=".5" y=".5" width="419" height="145" fill="none" stroke="#57525e" stroke-width="1" stroke-dasharray="6 5" opacity=".34" class="dash"/><text x="22" y="42" font-size="21" font-weight="700" letter-spacing="1.2" fill="#6f6a62" opacity=".85">untitled</text><rect x="132" y="27" width="11" height="18" fill="#57525e" opacity=".55" class="cr"/><text x="402" y="30" text-anchor="end" font-size="9.5" letter-spacing="2.2" fill="#6f6a62">layer:06</text><rect x="22" y="55" width="350" height="1" fill="#57525e" opacity=".22"/><text x="22" y="80" font-size="11.5" fill="#6f6a62" opacity=".8">a sixth device is already running here.</text><text x="22" y="97" font-size="11.5" fill="#6f6a62" opacity=".8">it hasn't been given a name yet.</text><circle cx="26" cy="123" r="3.4" fill="#57525e" opacity=".6"/><text x="38" y="127" font-size="10.5" letter-spacing="1.4" fill="#6f6a62" opacity=".72">--</text><text x="66" y="127" font-size="10.5" letter-spacing="1.4" fill="#6f6a62">// --</text><rect x="360" y="113" width="42" height="19" fill="#57525e" opacity=".09" class="pl"/><text x="394" y="126.5" text-anchor="end" font-size="9.5" letter-spacing="1.8" fill="#57525e" opacity=".8">SOON</text><circle cx="402" cy="132" r="2.6" fill="#57525e" class="pl" opacity=".8"/><rect class="sc" x="3" y="0" width="417" height="1.2" fill="url(#scg)" opacity=".14"/><rect width="420" height="146" fill="url(#sl)" opacity=".55"/><rect width="420" height="146" filter="url(#grain)" opacity=".06"/></svg>