<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 146" width="420" height="146" role="img" aria-label="Snappy"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes scan{0%{transform:translateY(-10px);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translateY(150px);opacity:0}}
@keyframes blink{0%,47%{opacity:1}50%,97%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.75}}
@keyframes crawl{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-18px}}
.sc{animation:scan 5.5s linear infinite}
.bk{animation:blink 1.8s infinite steps(1,end)}
.pl{animation:pulse 3.4s ease-in-out infinite}
.cr{animation:blink 1.1s infinite steps(1,end)}
.dash{animation:crawl 3s linear infinite}
</style><defs>
<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".55"/>
</pattern>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
</defs><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d99a4e" stop-opacity=".16"/><stop offset="60%" stop-color="#d99a4e" stop-opacity="0"/></linearGradient><linearGradient id="scg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d99a4e" stop-opacity="0"/><stop offset="50%" stop-color="#d99a4e" stop-opacity=".85"/><stop offset="100%" stop-color="#d99a4e" stop-opacity="0"/></linearGradient></defs><rect width="420" height="146" fill="#0b0a0f"/><rect width="420" height="146" fill="url(#gl)"/><rect x="0" y="0" width="3" height="146" fill="#d99a4e" opacity=".9"/><rect x=".5" y=".5" width="419" height="145" fill="none" stroke="#d99a4e" stroke-width="1" opacity=".30"/><text x="22" y="42" font-size="21" font-weight="700" letter-spacing="1.2" fill="#d9d2c5">snappy</text><text x="402" y="30" text-anchor="end" font-size="9.5" letter-spacing="2.2" fill="#6f6a62">layer:04</text><rect x="22" y="55" width="350" height="1" fill="#d99a4e" opacity=".22"/><text x="22" y="80" font-size="11.5" fill="#6f6a62">clipping, just a little better.</text><text x="22" y="97" font-size="11.5" fill="#6f6a62">screen capture that stays out of the way.</text><circle cx="26" cy="123" r="3.4" fill="#d99a4e"/><text x="38" y="127" font-size="10.5" letter-spacing="1.4" fill="#d9d2c5" opacity=".72">c#</text><text x="66" y="127" font-size="10.5" letter-spacing="1.4" fill="#6f6a62">// 593 kb</text><rect x="340" y="113" width="62" height="19" fill="#d99a4e" opacity=".13"/><text x="394" y="126.5" text-anchor="end" font-size="9.5" letter-spacing="1.8" fill="#d99a4e">OFFLINE</text><circle cx="402" cy="132" r="2.6" fill="#d99a4e" class="bk" opacity=".8"/><rect class="sc" x="3" y="0" width="417" height="1.2" fill="url(#scg)" opacity=".26"/><rect width="420" height="146" fill="url(#sl)" opacity=".55"/><rect width="420" height="146" filter="url(#grain)" opacity=".06"/></svg>